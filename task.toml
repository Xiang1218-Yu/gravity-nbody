schema_version = "1.3"
allow_internet = true

[task]
name = "local/gravity-nbody"
description = "Repair a deterministic two-dimensional softened Newtonian n-body simulator with velocity-Verlet integration, collision-component merging, diagnostics, strict validation, and atomic output."
authors = [{ name = "xyj" }]
keywords = ["physics", "simulation", "n-body", "numerical-methods"]

[agent]
entrypoint = "solution/solve.sh"
timeout_sec = 3600

[environment]
dockerfile = "environment/Dockerfile"
build_timeout_sec = 900
cpus = 1
memory_mb = 2048
storage_mb = 4096
gpus = 0
allow_internet = true
network_mode = "public"

[verifier]
entrypoint = "tests/test.sh"
timeout_sec = 300

[metadata]
difficulty = "expert"
category = "physics"
tags = ["physics", "simulation", "n-body", "numerical-methods"]
expert_time_estimate = "4h"
